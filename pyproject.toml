[project]
name = "optimlightpipes"
version = "0.1.0"
description = "LightPipes accelerated with numba guvectorize kernels"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numba>=0.67.0",
    "numpy>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyfftw>=0.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Unmodified upstream, used as the oracle for the differential tests in
    # tests/. Pinned exactly: the tests assert this version, since a different
    # upstream release would change what "correct" means.
    "lightpipes==2.1.5",
]

[tool.pytest.ini_options]
# The 14 root-level test_*.py files are demos: no asserts, and they call a
# blocking plt.show(). Only collect the real suite under tests/.
testpaths = ["tests"]

[build-system]
# Without this table uv treats the project as "virtual" and never installs it
# into its own venv, so scripts outside the repo root cannot import it.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["OptimLightPipes"]
